name: Build KURUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Use Ubuntu 20.04 (Focal / GLIBC 2.31) to guarantee backward compatibility with TrimUI stock GLIBC
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabi \
            libc6-dev-armel-cross \
            make \
            zip \
            git \
            ca-certificates \
            libsdl1.2-dev

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git and calculate next version
        id: versioning
        run: |
          git config --global --add safe.directory "*"
          BASE_VERSION=$(tr -d ' \r\n' < VERSION)
          echo "Base Version prefix: ${BASE_VERSION}"

          git fetch --tags --force || true

          LATEST_PATCH=$(git tag -l "v${BASE_VERSION}.*" | sed -E "s/^v${BASE_VERSION}\.([0-9]+)$/\1/" | sort -n | tail -n 1)
          if [ -z "$LATEST_PATCH" ]; then
            NEXT_PATCH=1
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi

          RELEASE_TAG="v${BASE_VERSION}.${NEXT_PATCH}"
          echo "Computed Release Tag: ${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build lightweight SDL stub for ARM linker
        run: |
          mkdir -p /tmp/sdl_arm
          # Header-independent C symbols for ARM dynamic linker
          cat << 'EOF' > /tmp/stub_sdl.c
          int SDL_Init(int f) { (void)f; return 0; }
          void SDL_Quit(void) {}
          void *SDL_SetVideoMode(int w, int h, int b, int f) { (void)w;(void)h;(void)b;(void)f; return 0; }
          void SDL_WM_SetCaption(const char *t, const char *i) { (void)t;(void)i; }
          int SDL_ShowCursor(int t) { (void)t; return 0; }
          unsigned int SDL_GetTicks(void) { return 0; }
          void SDL_Delay(unsigned int ms) { (void)ms; }
          int SDL_PollEvent(void *e) { (void)e; return 0; }
          int SDL_Flip(void *s) { (void)s; return 0; }
          int SDL_FillRect(void *d, void *r, unsigned int c) { (void)d;(void)r;(void)c; return 0; }
          unsigned int SDL_MapRGB(const void *f, unsigned char r, unsigned char g, unsigned char b) { (void)f;(void)r;(void)g;(void)b; return 0; }
          int SDL_OpenAudio(void *d, void *o) { (void)d;(void)o; return 0; }
          void SDL_CloseAudio(void) {}
          void SDL_PauseAudio(int p) { (void)p; }
          void SDL_LockAudio(void) {}
          void SDL_UnlockAudio(void) {}
          char *SDL_GetError(void) { return ""; }
          EOF
          arm-linux-gnueabi-gcc -shared -fPIC -nostdlib -Wl,-soname,libSDL-1.2.so.0 -o /tmp/sdl_arm/libSDL-1.2.so.0 /tmp/stub_sdl.c
          ln -s /tmp/sdl_arm/libSDL-1.2.so.0 /tmp/sdl_arm/libSDL.so

      - name: Build KURUI for TRIMUI Model S
        run: |
          make clean
          make CC=arm-linux-gnueabi-gcc \
               VERSION_TAG="${{ steps.versioning.outputs.tag }}" \
               EXTRA_CFLAGS="-I/usr/include/SDL -D_GNU_SOURCE=1 -D_REENTRANT" \
               EXTRA_LIBS="-L/tmp/sdl_arm -lSDL -Wl,--as-needed"
          arm-linux-gnueabi-strip kurui

      - name: Package Release
        run: |
          mkdir -p release/Apps/kurui
          cp kurui release/Apps/kurui/
          cp scripts/trimui_init.sh release/
          cp scripts/update.sh release/
          cp scripts/updater release/

          cat << EOF > release/README.txt
          KURUI ${{ steps.versioning.outputs.tag }} - Custom Minimal Launcher for TRIMUI Model S (Powkiddy A66)

          [Installation Method 1: Instant Launch via TRIMUI FILE Menu (Recommended)]
          1. Copy 'trimui_kurui.zip' (for FW 0.106+) or 'TrimuiUpdate_kurui.zip' (for FW <= 0.105) onto your MicroSD card.
          2. On TRIMUI, open the FILE menu and execute the zip file.
          3. KURUI will launch instantly on your screen!

          [Installation Method 2: Manual Setup]
          1. Place 'Apps/kurui/kurui' into /mnt/SDCARD/Apps/kurui/kurui
          2. Place 'trimui_init.sh' directly into /mnt/SDCARD/trimui_init.sh
          EOF

          cd release && zip -r ../trimui_kurui.zip *
          cp ../trimui_kurui.zip ../TrimuiUpdate_kurui.zip
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimui_kurui-${{ steps.versioning.outputs.tag }}
          path: |
            trimui_kurui.zip
            TrimuiUpdate_kurui.zip
          retention-days: 30

      - name: Create Git Tag and GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          body: |
            ### KURUI ${{ steps.versioning.outputs.tag }}
            TRIMUI Model S (Powkiddy A66) 向けカスタムランチャー自動ビルドリリース

            - **ターゲット**: Allwinner F1C100s (ARMv5TE / GLIBC 2.4+ 互換)
            - **起動方法**:
              - **FW 0.106 以降 (標準)**: `trimui_kurui.zip` をSDカードに入れて「FILE」メニューから実行
              - **FW 0.105 以前**: `TrimuiUpdate_kurui.zip` をSDカードに入れて「FILE」メニューから実行
          files: |
            trimui_kurui.zip
            TrimuiUpdate_kurui.zip
