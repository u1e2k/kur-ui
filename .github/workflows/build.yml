name: Build KURUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Run entire job inside Debian Bookworm container (clean multiarch support for armel)
    container:
      image: debian:bookworm-slim

    steps:
      - name: Install dependencies and cross toolchain
        run: |
          # Eliminate version mismatches from security/updates by pinning to pure bookworm main
          rm -f /etc/apt/sources.list.d/*
          echo "deb http://deb.debian.org/debian bookworm main" > /etc/apt/sources.list
          dpkg --add-architecture armel
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential \
            git \
            zip \
            ca-certificates \
            gcc-arm-linux-gnueabi \
            libc6-dev-armel-cross \
            libsdl1.2-dev:armel

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure safe directory and calculate next version
        id: versioning
        run: |
          git config --global --add safe.directory "*"

          # Read Base Major.Minor from VERSION file (e.g. "0.0")
          BASE_VERSION=$(tr -d ' \r\n' < VERSION)
          echo "Base Version prefix: ${BASE_VERSION}"

          # Fetch all remote tags
          git fetch --tags --force || true

          # Find highest existing patch number for this base version
          LATEST_PATCH=$(git tag -l "v${BASE_VERSION}.*" | sed -E "s/^v${BASE_VERSION}\.([0-9]+)$/\1/" | sort -n | tail -n 1)

          if [ -z "$LATEST_PATCH" ]; then
            NEXT_PATCH=1
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi

          RELEASE_TAG="v${BASE_VERSION}.${NEXT_PATCH}"
          echo "Computed Release Tag: ${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build KURUI for TRIMUI Model S
        run: |
          make clean
          make CC=arm-linux-gnueabi-gcc \
               VERSION_TAG="${{ steps.versioning.outputs.tag }}" \
               EXTRA_CFLAGS="-I/usr/include/SDL -D_GNU_SOURCE=1 -D_REENTRANT" \
               EXTRA_LIBS="-L/usr/lib/arm-linux-gnueabi -lSDL -lpthread"
          arm-linux-gnueabi-strip kurui

      - name: Package Release
        run: |
          mkdir -p release/apps/kurui
          cp kurui release/apps/kurui/
          cp scripts/trimui_init.sh release/
          cp scripts/update.sh release/

          cat << EOF > release/README.txt
          KURUI ${{ steps.versioning.outputs.tag }} - Custom Minimal Launcher for TRIMUI Model S (Powkiddy A66)

          [Installation Method 1: Automatic Update]
          1. Copy 'update.sh', 'trimui_init.sh', and 'apps/' to the root of your MicroSD card.
          2. Insert MicroSD card into TRIMUI Model S and power on.
          3. Installation completes automatically and reboots into KURUI.

          [Installation Method 2: Manual]
          1. Place 'apps/kurui/kurui' into /mnt/SDCARD/apps/kurui/kurui
          2. Place 'trimui_init.sh' directly into /mnt/SDCARD/trimui_init.sh
          EOF

          cd release && zip -r ../trimui_kurui.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimui_kurui-${{ steps.versioning.outputs.tag }}
          path: trimui_kurui.zip
          retention-days: 30

      - name: Create Git Tag and GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          body: |
            ### KURUI ${{ steps.versioning.outputs.tag }}
            TRIMUI Model S (Powkiddy A66) 向けカスタムランチャー自動ビルドリリース

            - **ターゲット**: Allwinner F1C100s (ARMv5TE)
            - **ダウンロード**: 下記の `trimui_kurui.zip` をダウンロードし、MicroSDカードに展開してください。
          files: trimui_kurui.zip
