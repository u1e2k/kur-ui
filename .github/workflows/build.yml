name: Build KURUI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install ARM Cross-compiler and SDL headers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabi libsdl1.2-dev zip

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate next version tag
        id: versioning
        run: |
          BASE_VERSION=$(tr -d ' \r\n' < VERSION)
          echo "Base Version prefix: ${BASE_VERSION}"

          git fetch --tags --force || true

          LATEST_PATCH=$(git tag -l "v${BASE_VERSION}.*" | sed -E "s/^v${BASE_VERSION}\.([0-9]+)$/\1/" | sort -n | tail -n 1)
          if [ -z "$LATEST_PATCH" ]; then
            NEXT_PATCH=1
          else
            NEXT_PATCH=$((LATEST_PATCH + 1))
          fi

          RELEASE_TAG="v${BASE_VERSION}.${NEXT_PATCH}"
          echo "Computed Release Tag: ${RELEASE_TAG}"
          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build lightweight SDL stub for ARM linker
        run: |
          # Create an interface stub for ARM linker (resolves SDL symbols at link time, binds to real /usr/lib/libSDL.so on device)
          mkdir -p /tmp/sdl_arm
          cat << 'EOF' > /tmp/stub_sdl.c
          #include <SDL/SDL.h>
          int SDL_Init(Uint32 f) { (void)f; return 0; }
          void SDL_Quit(void) {}
          SDL_Surface *SDL_SetVideoMode(int w, int h, int b, Uint32 f) { (void)w;(void)h;(void)b;(void)f; return 0; }
          void SDL_WM_SetCaption(const char *t, const char *i) { (void)t;(void)i; }
          int SDL_ShowCursor(int t) { (void)t; return 0; }
          Uint32 SDL_GetTicks(void) { return 0; }
          void SDL_Delay(Uint32 ms) { (void)ms; }
          int SDL_PollEvent(SDL_Event *e) { (void)e; return 0; }
          int SDL_Flip(SDL_Surface *s) { (void)s; return 0; }
          int SDL_FillRect(SDL_Surface *d, SDL_Rect *r, Uint32 c) { (void)d;(void)r;(void)c; return 0; }
          Uint32 SDL_MapRGB(const SDL_PixelFormat *const f, const Uint8 r, const Uint8 g, const Uint8 b) { (void)f;(void)r;(void)g;(void)b; return 0; }
          int SDL_OpenAudio(SDL_AudioSpec *d, SDL_AudioSpec *o) { (void)d;(void)o; return 0; }
          void SDL_CloseAudio(void) {}
          void SDL_PauseAudio(int p) { (void)p; }
          void SDL_LockAudio(void) {}
          void SDL_UnlockAudio(void) {}
          char *SDL_GetError(void) { return ""; }
          EOF
          arm-linux-gnueabi-gcc -shared -fPIC -o /tmp/sdl_arm/libSDL.so /tmp/stub_sdl.c

      - name: Build KURUI for TRIMUI Model S
        run: |
          make clean
          make CC=arm-linux-gnueabi-gcc \
               VERSION_TAG="${{ steps.versioning.outputs.tag }}" \
               EXTRA_CFLAGS="-I/usr/include/SDL -D_GNU_SOURCE=1 -D_REENTRANT" \
               EXTRA_LIBS="-L/tmp/sdl_arm -lSDL -lpthread"
          arm-linux-gnueabi-strip kurui

      - name: Package Release
        run: |
          mkdir -p release/apps/kurui
          cp kurui release/apps/kurui/
          cp scripts/trimui_init.sh release/
          cp scripts/update.sh release/
          cp scripts/updater release/

          cat << EOF > release/README.txt
          KURUI ${{ steps.versioning.outputs.tag }} - Custom Minimal Launcher for TRIMUI Model S (Powkiddy A66)

          [Installation Method 1: Automatic Update (Recommended)]
          1. Copy 'updater', 'trimui_init.sh', and 'apps/' to the root of your MicroSD card.
          2. Insert MicroSD card into TRIMUI Model S and power on.
          3. Installation completes automatically and reboots into KURUI.

          [Installation Method 2: Manual]
          1. Place 'apps/kurui/kurui' into /mnt/SDCARD/apps/kurui/kurui
          2. Place 'trimui_init.sh' directly into /mnt/SDCARD/trimui_init.sh
          EOF

          cd release && zip -r ../trimui_kurui.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trimui_kurui-${{ steps.versioning.outputs.tag }}
          path: trimui_kurui.zip
          retention-days: 30

      - name: Create Git Tag and GitHub Release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: Release ${{ steps.versioning.outputs.tag }}
          body: |
            ### KURUI ${{ steps.versioning.outputs.tag }}
            TRIMUI Model S (Powkiddy A66) 向けカスタムランチャー自動ビルドリリース

            - **ターゲット**: Allwinner F1C100s (ARMv5TE)
            - **ダウンロード**: 下記の `trimui_kurui.zip` をダウンロードし、MicroSDカードに展開してください。
          files: trimui_kurui.zip
